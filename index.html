let products=defaultProducts.map(p=>({...p}));
let cart=[];
let filter="All";
let chosenPhotoData="";
const money=n=>"₹"+Number(n).toLocaleString("en-IN");
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>t.style.display="none",2500)}
// Preview uploaded photo. Keep the image data only in current page memory.
document.getElementById("photo").addEventListener("change",function(){
 const file=this.files&&this.files[0];if(!file)return;
 if(!file.type.startsWith("image/")){toast("Please select an image file");this.value="";return}
 if(file.size>8*1024*1024){toast("Please choose an image smaller than 8 MB");this.value="";return}
 const reader=new FileReader();reader.onload=()=>{chosenPhotoData=reader.result;const p=document.getElementById("preview");p.src=chosenPhotoData;p.style.display="block"};reader.readAsDataURL(file);
});
document.getElementById("reset-form").addEventListener("click",()=>{document.getElementById("product-form").reset();chosenPhotoData="";let p=document.getElementById("preview");p.src="";p.style.display="none"});
document.getElementById("product-form").addEventListener("submit",e=>{
 e.preventDefault();
 if(!chosenPhotoData){toast("Please choose a dress photo first");return}
 const name=document.getElementById("pname").value.trim();
 const price=Number(document.getElementById("pprice").value);
 const mrp=Number(document.getElementById("pmrp").value)||price;
 const sizes=[...document.getElementById("psizes").selectedOptions].map(o=>o.value);
 if(!name||price<1||!sizes.length){toast("Enter product name, price and at least one size");return}
 products.unshift({id:Date.now(),name,category:document.getElementById("pcategory").value,price,mrp,desc:document.getElementById("pdesc").value.trim()||"New arrival",sizes,image:chosenPhotoData,custom:true});
 filter="All";document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b.dataset.filter==="All"));
 renderProducts();document.getElementById("product-form").reset();chosenPhotoData="";document.getElementById("preview").src="";document.getElementById("preview").style.display="none";
 toast("Product added to this page");document.getElementById("shop").scrollIntoView({behavior:"smooth"});
});
function renderProducts(){
 const shown=products.filter(p=>filter==="All"||p.category===filter);
 document.getElementById("result-count").textContent=shown.length+" products";
 document.getElementById("products").innerHTML=shown.map(p=>`<article class="product"><img loading="lazy" src="${p.image}" alt="${escapeHtml(p.name)}" onerror="this.onerror=null;this.src='https://placehold.co/600x800/f0dfd6/722f3e?text=The+Karigar%27s'"><div class="pbody"><span class="tag">${p.custom?"YOUR PRODUCT":p.category.toUpperCase()}</span><h3>${escapeHtml(p.name)}</h3><div class="muted">${escapeHtml(p.desc||"")}</div><div class="price">${money(p.price)} <span class="old">${money(p.mrp||p.price)}</span></div><select id="size-${p.id}" aria-label="Choose size">${(p.sizes&&p.sizes.length?p.sizes:["M"]).map(s=>`<option value="${escapeHtml(s)}">Size ${escapeHtml(s)}</option>`).join("")}</select><button class="btn" onclick="addCart(${p.id})">Add to bag +</button>${p.custom?`<button class="btn secondary" style="width:100%;margin-top:7px" onclick="deleteProduct(${p.id})">Remove product</button>`:""}</div></article>`).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;renderProducts()}));
function addCart(id){const p=products.find(x=>x.id===id);const size=document.getElementById("size-"+id).value;const old=cart.find(x=>x.id===id&&x.size===size);if(old)old.qty++;else cart.push({...p,size,qty:1});renderCart();toast("Added to your bag")}
function qty(id,size,delta){const x=cart.find(p=>p.id===id&&p.size===size);if(!x)return;x.qty+=delta;if(x.qty<=0)cart=cart.filter(p=>!(p.id===id&&p.size===size));renderCart()}
function removeCart(id,size){cart=cart.filter(p=>!(p.id===id&&p.size===size));renderCart()}
function deleteProduct(id){products=products.filter(p=>p.id!==id);cart=cart.filter(p=>p.id!==id);renderProducts();renderCart();toast("Product removed from this page")}
function renderCart(){
 document.getElementById("count").textContent=cart.reduce((n,x)=>n+x.qty,0);
 const total=cart.reduce((n,x)=>n+x.price*x.qty,0);document.getElementById("subtotal").textContent=money(total);document.getElementById("total").textContent=money(total);
 document.getElementById("cart-items").innerHTML=cart.length?cart.map(x=>`<div class="cart-row"><img src="${x.image}" alt=""><div><strong>${escapeHtml(x.name)}</strong><small>Size ${escapeHtml(x.size)} · ${money(x.price)} each</small><div class="qty"><button type="button" onclick="qty(${x.id},'${x.size}',-1)">−</button><span>${x.qty}</span><button type="button" onclick="qty(${x.id},'${x.size}',1)">+</button></div></div><button class="remove" type="button" onclick="removeCart(${x.id},'${x.size}')">Remove</button></div>`).join(""):'<div class="empty">Your bag is empty.</div>';
}
document.getElementById("checkout-form").addEventListener("submit",e=>{
 e.preventDefault();if(!cart.length){toast("Add a product to your bag first");return}
 const phone=document.getElementById("phone").value.trim();if(!/^\d{10}$/.test(phone)){toast("Enter a valid 10-digit mobile number");return}
 const total=cart.reduce((n,x)=>n+x.price*x.qty,0);
 const lines=cart.map(x=>`• ${x.name} | Size ${x.size} | Qty ${x.qty} | ${money(x.price*x.qty)}`).join("\n");
 const message=`Hello The Karigar's, I want to place an order.\n\n${lines}\n\nTotal before shipping: ${money(total)}\nPayment preference: ${document.getElementById("payment").value}\n\nName: ${document.getElementById("cname").value.trim()}\nPhone: ${phone}\nAddress: ${document.getElementById("address").value.trim()}\nNote: ${document.getElementById("note").value.trim()||"None"}\n\nPlease confirm stock, shipping charges and payment details.`;
 if(/^91\d{10}$/.test(STORE_WHATSAPP)){window.open("https://wa.me/"+STORE_WHATSAPP+"?text="+encodeURIComponent(message),"_blank")}else{alert("Please edit STORE_WHATSAPP in the code with your number (91 + 10 digits) before ordering.\n\nOrder message:\n"+message)}
});
renderProducts();renderCart();
</script>
